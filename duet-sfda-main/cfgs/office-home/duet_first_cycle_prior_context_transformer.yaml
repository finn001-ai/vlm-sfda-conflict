MODEL:
  ARCH: resnet50
  METHOD: duet_first_cycle_prior_context_transformer
SETTING:
  DATASET: office-home
  S: 0
  T: 2
  SEED: 2020
  OUTPUT_SRC: source
CUDNN:
  BENCHMARK: false
OPTIM:
  METHOD: SGD
  MOMENTUM: 0.9
  LR: 0.01
  WD: 1e-3
  NESTEROV: TRUE
TEST:
  BATCH_SIZE: 64
  MAX_EPOCH: 4
  INTERVAL: 4
ACTIVE:
  CYCLE: 4
  CLS_PAR: 0.4
  EPSILON: 1e-5
  GENT_PAR: 1.0
  ARCH: ViT-B/32
  TTA_STEPS: 1
  CTX_INIT: a_photo_of_a
  N_CTX: 4
  LOAD: None
  IIC_PAR: 1.0
  FINE_LR: 1e-6
  Q_VALUE: 1.1
  BETA: 0.99
  KL_PAR: 0.4
  CON_PAR: 0.2
DUET_FCP:
  # 原始 apply_first_cycle_prior 语义：prob / prior.pow(POWER) 后按行归一化。
  # 不是 0.8*prior + 0.2*prob。
  POWER: 0.8
DUET_CONTEXT:
  ENABLED: true
  ACTIVE_CYCLES: [1,2,3]
  USE_STRICT_CONFLICT: true
  USE_WEAK_AGREEMENT: false
  ANCHORS_PER_CLASS: 8
  ANCHOR_TASK_CONF: 0.7
  ANCHOR_CLIP_CONF: 0.8
  ANCHOR_TASK_ENTROPY: 0.50
  ANCHOR_CLIP_ENTROPY: 0.50
  ENTROPY_WEIGHT: 1.0
  REQUIRE_PRE_POST_PRIOR_AGREEMENT: true
  WEAK_CONF_THRESHOLD: 0.70
  WEAK_ENTROPY_THRESHOLD: 1.00
  MODEL_DIM: 256
  NUM_HEADS: 4
  FFN_DIM: 512
  DROPOUT: 0.1
  TRAIN_STEPS_PER_CYCLE: 200
  TRAIN_BATCH_SIZE: 64
  LR: 0.0001
  WEIGHT_DECAY: 0.0001
  ACCEPT_CONF: 0.55
  ACCEPT_MARGIN: 0.10
  WEAK_ACCEPT_CONF: 0.55
  WEAK_ACCEPT_MARGIN: 0.10
  THIRD_CLASS_CONF: 0.65
  THIRD_CLASS_MARGIN: 0.20
  ALLOW_THIRD_CLASS: true
  ABSTAIN_WHEN_UNCERTAIN: true
  REFINER_TYPE: comparator
  COMPARATOR_HIDDEN: 64
  COMPARATOR_LAYERS: 2
  SIM_TOPK: 3
  MIN_RUNNER_PROB: 0.10
  MAX_TOP1_MARGIN: 0.60
  COMPARATOR_GATE: 0.20
  # Rank-based label-free gate: resolve only the top-20% comparator margins.
  COMPARATOR_COVERAGE_FRACTION: 0.20
  REPLAY_PER_DIRECTION: 64
  REPLAY_MIX_FRACTION: 0.25
  EARLY_STOP_ENABLED: false
  EARLY_STOP_VAL_FRACTION: 0.20
  EARLY_STOP_MIN_VAL_PER_DIRECTION: 6
  EARLY_STOP_CHECK_INTERVAL: 10
  EARLY_STOP_PATIENCE: 3
  EVAL_TRAJECTORY_ENABLED: true
  EVAL_TRAJECTORY_INTERVAL: 10
  EVAL_TRAJECTORY_COVERAGES: [10,20,40,60,80]
  AGREEMENT_AMBIGUITY_EVAL_ENABLED: true
  AGREEMENT_AMBIGUITY_FRACTIONS: [10,25,50,100]
  AGREEMENT_COMPARATOR_PROBE_ENABLED: true
  COMPARATOR_EPOCHS: 0
  SOFT_ONLY_ADMISSION: false
  DIST_MATCH_SYNTHETIC: true
  DIST_MATCH_Z_MAX: 1.5
  DIST_MATCH_DIMS: [4,5,6,7]
  MIN_DIST_MATCH_KEPT: 16
  KNN_K: 5
  SEED: 2020
  EVAL_ONLY_LOGGING: true
